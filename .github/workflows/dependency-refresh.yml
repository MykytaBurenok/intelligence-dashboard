name: Refresh dependency lockfile

on:
  push:
    branches: [chore/production-readiness]
    paths:
      - ".github/workflows/dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dependency branch
        uses: actions/checkout@v4
        with:
          ref: chore/production-readiness
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update vulnerable dependencies
        run: |
          npm install next@16.4.3 eslint-config-next@16.4.3
          npm audit fix
      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: update vulnerable dependencies"
            git push origin HEAD:chore/production-readiness
          fi
